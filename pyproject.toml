[project]
name = "vn"
version = "0.1.0"
description = "Vehicle normalization framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core normalization pipeline (src/)
    "faiss-cpu>=1.8.0",
    "jinja2>=3.1.6",
    "langchain>=0.3.25",
    "langchain-openai>=0.3.21",
    "openai>=1.84.0",
    "pydantic>=2.0",
    "tenacity>=9.1.2",
    "numpy>=1.26.0",
    "pandas>=2.3.3",
    # Downstream price regressors (src/train.py, notebooks/)
    "catboost>=1.2.10",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.7.2",
    # Reproduction scripts (scripts/)
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "statsmodels>=0.14.6",
    "psutil>=5.9",
    # Notebooks
    "ipykernel>=6.29.5",
]
